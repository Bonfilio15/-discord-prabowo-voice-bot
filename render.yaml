services:
  - type: web
    name: discord-prabowo-voice-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AUTO_JOIN_VOICE
        value: "true"
      - key: STT_PROVIDER
        value: "groq"
